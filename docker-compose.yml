services:
  jekyll:
    image: amirpourmand/al-folio:v0.12.1
    ports:
      - "8080:8080"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    # Fixed the livereload port flag here
    command: >
      bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload --livereload-port 35729"